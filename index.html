<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Clevermetric</title>
<style>
:root{
  --bg:#f2f3f5; --card:#ffffff; --ink:#17181a; --muted:#6a6f76; --line:#dfe2e6;
  --seg:#e8eaed; --seg-on:#17181a; --seg-on-ink:#ffffff; --accent:#17181a;
  --warn-bg:#fff4e0; --warn-ink:#8a5200; --warn-line:#f1d29a;
  --stage-edge:#eef0f2; --shadow:0 1px 2px rgba(20,22,26,.06),0 8px 28px rgba(20,22,26,.06);
  --font:ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111214; --card:#1a1c1f; --ink:#eceef1; --muted:#9097a0; --line:#2b2e33;
    --seg:#24272b; --seg-on:#eceef1; --seg-on-ink:#111214; --accent:#eceef1;
    --warn-bg:#2f2412; --warn-ink:#f3c46b; --warn-line:#5a4318;
    --stage-edge:#1a1c1f; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{overflow-x:clip;max-width:100%}   /* clip, not hidden: hidden makes body a scroller and breaks the sticky ruler */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  line-height:1.4;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.wrap{width:100%;min-width:0;max-width:1180px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 40px}
header{min-width:0;overflow-wrap:anywhere;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 2px 16px}
h1{font-size:22px;letter-spacing:.2px;margin:0;font-weight:700}
h1 span{font-weight:400;color:var(--muted)}
header p{margin:0;color:var(--muted);font-size:14px}

.stage{position:sticky;top:0;z-index:20;width:100%;min-width:0;max-width:100%;background:var(--stage-edge);border-radius:18px;box-shadow:var(--shadow);
  overflow:hidden;border:1px solid var(--line)}
.scroller{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;direction:ltr;-webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;scrollbar-width:thin}
.scroller svg{display:block}
.wipe{position:relative;display:inline-block;vertical-align:top}
.wipe .inv{position:absolute;inset:0;pointer-events:none}
.wipe .inv svg{display:block}
.wipe .handle{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #e8590c;cursor:ew-resize;z-index:2}
.wipe .handle::after{content:"⇆";position:absolute;top:50%;left:-17px;width:32px;height:32px;margin-top:-16px;border-radius:50%;
  background:#e8590c;color:#fff;font:700 16px/32px system-ui,sans-serif;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.wipe .grab{position:absolute;top:0;bottom:0;width:44px;margin-left:-22px;cursor:ew-resize;z-index:3;touch-action:none}
.hint{direction:rtl;font-size:12.5px;color:var(--muted);padding:6px 14px 8px;display:none}
.hint.on{display:block}

.panel{display:grid;gap:14px;margin-top:16px;grid-template-columns:minmax(0,1fr);width:100%;min-width:0}
.panel>*,.card,.seg,.seg label,.len,.adv,.adv>*{min-width:0;max-width:100%}
.card{width:100%}
@media (min-width:860px){ .panel{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .full{grid-column:1/-1} }
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.label{font-size:13px;color:var(--muted);margin:0 2px 8px;display:flex;justify-content:space-between;gap:8px}
.label b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;unicode-bidi:isolate}

.seg{display:flex;background:var(--seg);border-radius:13px;padding:4px;gap:4px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:10px;
  font-size:17px;font-weight:600;padding:0 8px;text-align:center;transition:background .15s,color .15s;user-select:none}
.seg input:checked + span{background:var(--seg-on);color:var(--seg-on-ink)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

.len{display:flex;align-items:center;gap:10px;direction:ltr}
.step{flex:0 0 48px;height:48px;border-radius:12px;border:0;background:var(--seg);color:var(--ink);
  font:600 24px/1 var(--font);cursor:pointer}
.step:active{transform:scale(.96)}
input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;background:transparent;height:48px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--seg)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--seg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--accent);margin-top:-12px;border:3px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--accent);
  border:3px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.25)}

details{padding:0}
summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:16px;display:flex;
  justify-content:space-between;align-items:center;min-height:52px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border-inline-end:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:rotate(45deg);margin-top:-4px;transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.adv{padding:0 14px 14px;display:grid;gap:4px 22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){ .adv{grid-template-columns:repeat(3,minmax(0,1fr))} }
.dotcol{display:flex;gap:10px;align-items:center}.dotcol select{flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line,#ccd);background:transparent;color:inherit}.dotcol input[type=color]{width:44px;height:36px;border:0;padding:0;background:none}
.adv h3{grid-column:1/-1;font-size:13px;color:var(--muted);margin:12px 2px 0;font-weight:600}
.row .label{margin-bottom:0}
.row input[type=range]{width:100%;direction:ltr;height:40px}
.btn{min-height:50px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font:600 16px var(--font);padding:0 18px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--seg-on-ink);border-color:var(--accent)}
.btn:active{transform:scale(.98)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.reset{grid-column:1/-1;margin-top:10px}
.warn{display:none;margin-top:12px;background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);
  border-radius:12px;padding:10px 12px;font-size:13.5px}
.warn.on{display:block}
.warn ul{margin:4px 0 0;padding-inline-start:18px}
footer{overflow-wrap:anywhere;color:var(--muted);font-size:12.5px;margin:22px 2px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Clevermetric <span>· קריאה מהקצה</span></h1>
    <p>כל שנת היא קצה בין שחור לריק — קוראים את המידה מהקצה</p>
  </header>

  <div class="stage">
    <div class="scroller" id="scroller" aria-label="ruler preview"></div>
    <div class="hint" id="hint">↔ גלול את הסרגל לצדדים</div>
  </div>
  <div class="warn" id="warn" role="status"></div>

  <div class="panel">
    <div class="card">
      <div class="label">ערכת צבע</div>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="t" value="flip"><span>בהיר</span></label>
        <label><input type="radio" name="t" value="invert"><span>כהה</span></label>
      </div>
    </div>
    <div class="card">
      <div class="label">רזולוציה</div>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="r" value="1"><span>כל מ״מ</span></label>
        <label><input type="radio" name="r" value="0.5"><span>כל חצי מ״מ</span></label>
      </div>
    </div>
    <div class="card">
      <div class="label">יחידות</div>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="u" value="mm"><span>מ״מ</span></label>
        <label><input type="radio" name="u" value="cm"><span>ס״מ</span></label>
      </div>
    </div>
    <div class="card">
      <div class="label">מספרים</div>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="l" value="all"><span>כולם</span></label>
        <label><input type="radio" name="l" value="key"><span>רק 0·5·10</span></label>
      </div>
    </div>
    <div class="card">
      <div class="label">לוגו</div>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="g" value="1"><span>מוצג</span></label>
        <label><input type="radio" name="g" value="0"><span>מוסתר</span></label>
      </div>
    </div>
    <div class="card full">
      <div class="label">אורך <b id="spanOut">10 מ״מ</b></div>
      <div class="len">
        <button class="step" id="minus" type="button" aria-label="קצר יותר">−</button>
        <input type="range" id="s" min="10" max="300" step="1" aria-label="אורך במילימטרים">
        <button class="step" id="plus" type="button" aria-label="ארוך יותר">+</button>
      </div>
    </div>

    <div class="card full">
      <div class="label">סימן הקצה: מרווחים (מ״מ)</div>
      <div class="adv" id="edgeAdv"></div>
    </div>

    <details class="card full" id="advBox">
      <summary>מתקדם</summary>
      <div class="adv" id="adv"></div>
    </details>

    <div class="card full">
      <div class="label">הורדה</div>
      <div class="actions">
        <button class="btn primary" id="dlPng" type="button">PNG ⤓</button>
        <button class="btn" id="dlSvg" type="button">SVG ⤓</button>
        <button class="btn" id="dlJson" type="button">שמירת הגדרות JSON ⤓</button>
        <button class="btn" id="ldJson" type="button">טעינת הגדרות ⤒</button>
        <input type="file" id="ldFile" accept="application/json,.json" hidden>
      </div>
    </div>
  </div>
  <footer>הסרגל עצמו משמאל לימין. ההגדרות נשמרות בכתובת (#) — אפשר לשתף קישור.</footer>
</div>

  if (isFinite(+j.invert_slider2_pct)) state.wp2 = Math.max(0, Math.min(100, +j.invert_slider2_pct));
  if (isFinite(+j.invert_line2_angle_deg)) state.wa2 = Math.max(-60, Math.min(60, +j.invert_line2_angle_deg));
  if (j.dot_fill && COL_OK.test(j.dot_fill)) state.df = j.dot_fill;
  if (j.dot_outline && COL_OK.test(j.dot_outline)) state.dl = j.dot_outline;
  if (j.advanced) Object.keys(ADV).forEach(function(k){ if (isFinite(+j.advanced[k])) state.adv[k] = +j.advanced[k]; });
  lastSvg = ""; schedule();
}
document.getElementById("dlJson").addEventListener("click", function(){
  save(new Blob([JSON.stringify(settingsJSON(), null, 2)], { type: "application/json" }), fname("json"));
});
var ldFile = document.getElementById("ldFile");
document.getElementById("ldJson").addEventListener("click", function(){ ldFile.click(); });
ldFile.addEventListener("change", function(){
  var f = ldFile.files && ldFile.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){ try { applyJSON(JSON.parse(r.result)); } catch (e) { alert("הקובץ לא נטען: " + e.message); } ldFile.value = ""; };
  r.readAsText(f);
});
window.__clever.settingsJSON = settingsJSON; window.__clever.applyJSON = applyJSON;
document.getElementById("dlSvg").addEventListener("click", function(){
  save(new Blob([composite(state).svg], { type: "image/svg+xml" }), fname("svg"));
});
document.getElementById("dlPng").addEventListener("click", function(){
  var out = composite(state);
  // 2x, clamped to what iOS canvases allow (≤16384 px side, ≤16.7 Mpx)
  var k = Math.min(2, 16384 / out.W, Math.sqrt(16.0e6 / (out.W * H)));
  var img = new Image();
  var url = URL.createObjectURL(new Blob([out.svg], { type: "image/svg+xml;charset=utf-8" }));
  img.onload = function(){
    var cv = document.createElement("canvas");
    cv.width = Math.round(out.W * k); cv.height = Math.round(H * k);
    var ctx = cv.getContext("2d");
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    try {
      cv.toBlob(function(b){ if (b) save(b, fname("png")); }, "image/png");
    } catch (e) {
      var a = document.createElement("a"); a.href = cv.toDataURL("image/png"); a.download = fname("png"); a.click();
    }
  };
  img.onerror = function(){ URL.revokeObjectURL(url); alert("יצירת PNG נכשלה בדפדפן הזה — נסה SVG"); };
  img.src = url;
});

readHash();
render();
})();
</script>
